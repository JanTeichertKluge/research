execute:
  eval: true
  echo: true
  include: true

format:
  revealjs:
    pagetitle: "Reading Group, 12/03/2025"
    subtitle: "I See, Therefore I Do: Estimating Causal Effects for Image Treatments"
    highlight-style: breezedark
    slide-number: true
    smaller: false # true
    scrollable: true
    code-copy: true
    code-link: true
    code-fold: true
    footer: "Jan Teichert-Kluge, Institute of Statistics"
    theme: [default, ../../shared_files/doubleml_theme.scss]
    chalkboard: # enables chalkboard see https://rajgoel.github.io/reveal.js-demos/chalkboard-demo.html#/
      boardmarker-width: 5
      theme: "chalkboard"
    css: styles.css
    filters: [slidenumber_filter.lua] # include lua script for filtering the appendix slides
    lightbox: true

from: markdown+emoji # enables emojis see https://gist.github.com/rxaviers/7360908
nocite: |
  @bach2022doubleml, @lightgbm