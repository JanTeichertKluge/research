bibliography: ../shared_files/bibliography.bib

execute:
  eval: true
  echo: true
  include: true
  
format:
  revealjs:
    highlight-style: breezedark
    slide-number: true
    code-copy: true
    code-link: true
    footer: "DoubleML Deep"
    theme: [default, ../shared_files/doubleml_theme.scss]
    chalkboard: # enables chalkboard see https://rajgoel.github.io/reveal.js-demos/chalkboard-demo.html#/
      boardmarker-width: 5
      theme: "chalkboard"

css: styles.css

nocite: |
  @bach2022doubleml